<!doctype html>
<html lang="en" data-app="bas-offline">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d1d1a">
    <title>BAS SC Helper</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 1.5rem; background: #1d1d1a; color: #fff; text-align: center;
            font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased;
        }
        main { max-width: 24rem; display: flex; flex-direction: column; align-items: center; }
        .brand { display: flex; align-items: center; gap: .75rem; margin-bottom: 2.5rem; }
        .brand img { height: 2rem; width: auto; }
        .dev-footer {
            display: none; color: #ef4444; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
            font-family: system-ui, sans-serif;
        }
        html[data-env="local"] .dev-footer { display: block; position: fixed; left: 0; right: 0; bottom: 0; padding: .5rem 0; font-size: .75rem; }
        body.launching .spinner, body.launching h1, body.launching p { visibility: hidden; }
        body.launching .brand { margin-bottom: 2.5rem; }
        .spinner {
            height: 2rem; width: 2rem; border: 3px solid rgba(184, 186, 184, .25); border-top-color: #1da15e;
            border-radius: 9999px; animation: spin .9s linear infinite;
        }
        h1 { margin: 1.5rem 0 0; font-size: 1.25rem; font-weight: 500; }
        p { margin: .5rem 0 0; font-size: .875rem; line-height: 1.5rem; color: #b8bab8; }
        @media (display-mode: standalone) {
            html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
            html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
    </style>
</head>
<body>
    <main>
        <div class="brand">
            <img src="/logo.svg" alt="BAS World">
        </div>
        <div class="spinner" aria-hidden="true"></div>
        <h1 id="title">Opening BAS SC Helper</h1>
        <p id="text"></p>
    </main>
    <div class="dev-footer">Development environment</div>
    <script>
        (function () {
            if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
                document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no');
                ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
                    document.addEventListener(name, function (event) { event.preventDefault(); });
                });
            }

            if (document.documentElement.getAttribute('data-env') === 'local') {
                document.title += ' [DEV]';
                document.querySelector('.brand img').setAttribute('src', '/logo-dev.svg');
            }

            var title = document.getElementById('title');
            var text = document.getElementById('text');
            var main = document.querySelector('main');
            var checking = false;
            var timer = null;

            // The app's start URL is answered with this page first. While the phone wakes its network up we only
            // show the logo and keep probing; a message appears when that still fails after the grace period.
            var GRACE_MS = 2500;
            var launching = location.pathname === '/' && location.search.indexOf('go=') === -1;

            function render() {
                document.body.classList.toggle('launching', launching);
                main.setAttribute('role', launching ? 'status' : 'alert');

                if (launching) return;

                if (!navigator.onLine) {
                    title.textContent = 'No internet connection';
                    text.textContent = "Connect to Wi-Fi or mobile data to use BAS SC Helper. This page reloads by itself when you're back online.";
                } else {
                    title.textContent = "Can't reach the server";
                    text.textContent = "The server isn't responding right now. We keep checking and will reload this page automatically.";
                }
            }

            function proceed() {
                if (location.pathname === '/' && location.search.indexOf('go=') === -1) {
                    location.replace('/?go=1');
                } else {
                    location.reload();
                }
            }

            function schedule() {
                clearTimeout(timer);
                timer = setTimeout(check, launching ? 400 : 2000);
            }

            function check() {
                if (checking) return;
                checking = true;
                var controller = new AbortController();
                var abort = setTimeout(function () { controller.abort(); }, 3000);

                fetch('/up?_=' + Date.now(), { cache: 'no-store', signal: controller.signal })
                    .then(function (response) { if (response.ok) proceed(); })
                    .catch(function () {})
                    .then(function () { clearTimeout(abort); checking = false; render(); schedule(); });
            }

            render();
            check();

            if (launching) {
                setTimeout(function () { launching = false; render(); }, GRACE_MS);
            }

            window.addEventListener('online', function () { render(); clearTimeout(timer); setTimeout(check, 300); });
            window.addEventListener('offline', render);
        })();
    </script>
</body>
</html>
